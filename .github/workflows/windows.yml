name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test Windows/BitReaper.Tests/BitReaper.Tests.csproj -c Release

      - name: Package x64 and arm64
        shell: pwsh
        run: Windows/Scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: BitReaper-Windows
          path: dist/BitReaper-Windows-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BitReaper-Windows-*.zip
